<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OpenSlot - Find your next open slot">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>OpenSlot</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #000000;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #1A1A2E;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .logo {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 20px;
      color: white;
    }

    .tagline {
      font-size: 18px;
      margin-bottom: 40px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">OpenSlot</div>
    <div class="tagline">Find your next open slot</div>
    <div class="spinner"></div>
  </div>

  <script src="flutter.js" defer></script>
  <script>
    // Simplified initialization
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: null,
        }
      }).then(function(engineInitializer) {
        return engineInitializer.initializeEngine();
      }).then(function(appRunner) {
        return appRunner.runApp();
      }).then(function() {
        // Hide loading screen
        document.getElementById('loading').style.display = 'none';
      }).catch(function(error) {
        console.error('Failed to initialize Flutter app:', error);
        // Show error message
        document.getElementById('loading').innerHTML = `
          <div class="logo">OpenSlot</div>
          <div style="color: #ff6b6b; margin-top: 20px;">Loading failed. Please refresh the page.</div>
        `;
      });
    });
  </script>
</body>
</html>
