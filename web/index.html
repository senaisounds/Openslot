<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OpenSlot - Find your next performance slot">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>OpenSlot - Performance Finder</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png"/>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1A1A2E;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #1A1A2E;
    }

    .logo {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 20px;
      color: white;
    }

    .tagline {
      font-size: 18px;
      margin-bottom: 40px;
      opacity: 0.9;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-message {
      margin-top: 20px;
      text-align: center;
      font-size: 18px;
      font-weight: 500;
    }

    .error-message {
      color: #ff6b6b;
      font-size: 16px;
      margin-top: 20px;
      text-align: center;
    }

    .retry-button {
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid white;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.3s ease;
    }

    .retry-button:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">OpenSlot</div>
    <div class="tagline">Find your next performance slot</div>
    <div class="spinner"></div>
    <div class="status-message">Loading OpenSlot...</div>
  </div>

  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function(ev) {
      // Simple Flutter initialization
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: null,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            return appRunner.runApp();
          }).then(function() {
            // Successfully loaded the app
            document.getElementById('loading').style.display = 'none';
          }).catch(function(error) {
            console.error('Failed to run OpenSlot app:', error);
            showError();
          });
        }
      }).catch(function(error) {
        console.error('Failed to load Flutter entrypoint:', error);
        showError();
      });
    });

    function showError() {
      const loadingDiv = document.getElementById('loading');
      loadingDiv.innerHTML = `
        <div class="logo">OpenSlot</div>
        <div class="tagline">Find your next open slot</div>
        <div class="error-message">Failed to load application</div>
        <button class="retry-button" onclick="location.reload()">Try Again</button>
      `;
    }
  </script>
</body>
</html>
